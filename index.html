
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONPULSE - User Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #101411;
            margin: 0;
            color: #f4f4f4;
        }

        header {
            background-color: #171e19;
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 3px solid #b7f000;
        }

        header h1 {
            color: #b7f000;
            margin: 0;
            letter-spacing: 3px;
        }

        .container {
            width: 65%;
            margin: 30px auto;
            padding: 25px;
            background-color: #1b241e;
            border: 1px solid #344238;
            border-radius: 10px;
            box-shadow: 0 2px 8px #000;
        }

        h2 {
            color: #b7f000;
            text-align: center;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: inline-block;
            width: 140px;
            color: #b7f000;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="email"],
        select {
            width: 220px;
            padding: 9px;
            border: 1px solid #647267;
            border-radius: 5px;
            background-color: #101711;
            color: white;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
            accent-color: #b7f000;
        }

        input:focus,
        select:focus {
            outline: 2px solid #b7f000;
        }

        button {
            background-color: #b7f000;
            color: #101411;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #d2ff43;
        }

        .submit {
            text-align: center;
            margin-top: 20px;
        }

        footer {
            background-color: #171e19;
            color: white;
            text-align: center;
            padding: 15px;
            border-top: 2px solid #b7f000;
        }

        @media(max-width: 650px) {
            .container {
                width: 92%;
            }

            label {
                display: block;
                margin-bottom: 5px;
            }

            input[type="text"],
            input[type="password"],
            input[type="number"],
            input[type="email"],
            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>IRONPULSE</h1>
        <p>GEAR UP. GET STRONGER.</p>
    </header>

    <div class="container">

        <h2>User Registration Form</h2>

        <p style="text-align:center;">
            Join the IRONPULSE fitness community!
        </p>

        <form action="/server" method="POST" id="registerForm">

            <!-- Name -->
            <div class="form-group">
                <label>Name:</label>
                <input type="text"
                    name="name"
                    placeholder="Enter your name"
                    pattern="[A-Za-z ]+"
                    title="Name must contain only letters"
                    required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password:</label>
                <input type="password"
                    name="password"
                    placeholder="Enter password"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                    title="Must contain uppercase, lowercase, number and at least 8 characters"
                    required>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label>Age:</label>
                <input type="number"
                    name="age"
                    min="18"
                    max="30"
                    placeholder="Enter age"
                    required>
            </div>

            <!-- Mobile Number -->
            <div class="form-group">
                <label>Mobile Number:</label>
                <input type="text"
                    name="mobile"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    placeholder="10 digit number"
                    required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email:</label>
                <input type="email"
                    name="email"
                    placeholder="Enter email"
                    required>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender:</label>

                <input type="radio"
                    name="gender"
                    value="Male"
                    required> Male

                <input type="radio"
                    name="gender"
                    value="Female"> Female
            </div>

            <!-- State -->
            <div class="form-group">
                <label>State:</label>

                <select name="state" required>
                    <option value="">Select State</option>
                    <option>Tamil Nadu</option>
                    <option>Kerala</option>
                    <option>Karnataka</option>
                    <option>Andhra Pradesh</option>
                    <option>Telangana</option>
                    <option>Maharashtra</option>
                    <option>Delhi</option>
                </select>
            </div>

            <!-- Fitness Interests -->
            <div class="form-group">
                <label>Fitness Interests:</label>

                <input type="checkbox"
                    name="skills"
                    value="Strength Training"> Strength Training

                <br><br>

                <label></label>
                <input type="checkbox"
                    name="skills"
                    value="Cardio Training"> Cardio Training

                <input type="checkbox"
                    name="skills"
                    value="Yoga and Flexibility"> Yoga and Flexibility
            </div>

            <!-- Submit -->
            <div class="submit">
                <button type="submit">Register Now</button>
            </div>

        </form>
    </div>

    <footer>
        <p>IRONPULSE Fitness Equipment Store | Train • Perform • Achieve</p>
    </footer>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {

            var skills = document.querySelectorAll(
                'input[name="skills"]:checked'
            );

            if (skills.length === 0) {
                event.preventDefault();
                alert("Please select at least one fitness interest.");
            }

        });
    </script>

</body>
</html>
